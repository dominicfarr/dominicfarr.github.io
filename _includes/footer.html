{%- if page.mermaid %}
<script type="module">
  // Render ```mermaid code blocks as diagrams. Only pages with `mermaid: true` load this.
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs";
  // Kramdown emits either div.language-mermaid (Rouge wrapper) or pre > code.language-mermaid
  const blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
  for (const block of blocks) {
    const outer = block.matches("div") ? block : block.parentElement;
    if (!outer.isConnected) continue;
    const diagram = document.createElement("pre");
    diagram.className = "mermaid";
    diagram.textContent = block.textContent;
    outer.replaceWith(diagram);
  }
  // The site is always light (minima 2.5 ignores `skin: auto`), so the diagrams are too
  mermaid.initialize({ startOnLoad: false, theme: "default" });
  await mermaid.run();
</script>
{%- endif %}
